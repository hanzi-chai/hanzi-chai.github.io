name: Publish

on:
  push:
    branches: ["main", "beta"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun (TypeScript maintenance scripts)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11.21.2

      - name: Check release version and npm tag
        id: version-check
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const beta = process.env.GITHUB_REF_NAME === 'beta';
          const pattern = beta ? /^\d+\.\d+\.\d+-beta\.\d+$/ : /^\d+\.\d+\.\d+$/;
          if (!pattern.test(version)) {
            throw new Error(`Invalid version ${version} for branch ${process.env.GITHUB_REF_NAME}`);
          }
          const tag = beta ? 'beta' : 'latest';
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          if (!response.ok && response.status !== 404) {
            throw new Error(`npm registry returned HTTP ${response.status}`);
          }
          const changed = response.status === 404;
          console.log(`${name}@${version}: tag=${tag}, publish=${changed}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\ntag=${tag}\n`);
          NODE

      - name: Install dependencies
        if: steps.version-check.outputs.changed == 'true'
        run: npm install --workspaces=false

      - name: Prepare package data
        if: steps.version-check.outputs.changed == 'true'
        run: npm run fetch:data

      - name: Build and verify package
        if: steps.version-check.outputs.changed == 'true'
        run: |
          npm run build
          npm run check:package

      - name: Publish to npm
        if: steps.version-check.outputs.changed == 'true'
        run: npm publish --tag "${{ steps.version-check.outputs.tag }}"
