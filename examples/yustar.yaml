version: '0.4'
source: yustar
info:
  name: 星陈
  author: 朱宇浩
  version: 3.11.0-beta
  description: |
    十万汉字字形输入・繁简通打。
    相似字根分九十九大类排布于二十五键。
    方案名取自《尚书大传》之「明明上天烂然星陈」。
analysis:
  classifier:
    竖钩: 5
    竖提: 6
    竖折: 6
    竖弯: 6
    竖弯钩: 6
    竖折撇: 6
    竖折折钩: 6
    竖折折: 6
    撇点: 6
    撇折: 6
    斜钩: 6
  degenerator:
    feature:
      提: 横
      捺: 点
    no_cross: false
    no_insert_between_heng: true
  selector:
    - 根少优先
    - 结构完整
    - 连续笔顺
    - 能连不交
    - 能散不连
    - 少弱字根
    - 取大优先
  customize:
    # 両的冂和山候选已存在，沿用星陈取根。
    字形-850: ['1', 冂, 山]
    # 包围外框与整字按同一个字根取码。
    字形-136024: [門]
    字形-136025: [風]
    字形-136041: [風]
    # 台标華字底已有一、艹、奉下的切片。
    字形-1189: ['1', 艹, ]
    # 為的兼容形仍按官方拆分取首点和爲下。
    字形-9149: ['4', ]
    # 台标璺的字形已由共享库提供，沿用星陈的字根次序。
    字形-137311: [冂, '1', 丅, , 冖, 王, '4']
    # 目标切片已存在，按星陈取根约定从候选中选取。
    字形-663: ['1', 字形-190004]
    字形-829: [二, 字形-190004]
    字形-700: ['2', '1', '2', '5', '1']
    字形-846: ['1', 冂, ]
    字形-461: ['1', ]
    # 兼容码分别取两个十，通常字形仍取艹。
    字形-191101: [千, 十, 十, 二]
    :
      - 耳
      - 戈
    两:
      - '1'
      - 冂
      - 人
      - 人
    丙:
      - '1'
      - 冂
      - 人
    乑:
      - 亻
      - 
      - 
    丼:
      - 廾
      - 亠
    匁:
      - 
      - 乂
    重:
      - 千
      - 里
    # 按官方拆分校正复用的部件字形，避免形近根覆盖。
    字形-328: [夊]
    字形-337: [几, '4']
    字形-585: ['3', '5', 又]
    字形-740: [冂, 土]
    字形-1020: ['3', 糸]
    字形-1154: []
    字形-1171: [龶]
    字形-1179: [, '1', 止]
    字形-1207: [几, '4']
    字形-1217: [匚, ]
    # 保留尚需覆盖的取根次序和局部字形。
    字形-1138: ['3', 糸]
    # 港、台标「虱／風」内的横画按参考字形保留。
    字形-1144: ['3', 虫]
    字形-1166: [气]
    字形-4215: ['2', 八, 八]
    字形-14447: [口, 亠, 囗, 口]
    字形-73922: [䒑, 大]
    字形-66186: [龶, 夊]
    字形-130525: [艹, '1', 廾, 刂]
    字形-133733: [, ]
    # 采用台标拆分表的字根次序。
    字形-134663: [丰, , '2', ]
    字形-127101: [口, 丄, '2', , 辶]
    字形-196562: [冂, '1', 丅, ]
    # 共用部件仍需沿用星陈的取根。
    字形-12944: [, , 匕]
    字形-1366: [亻, 人, 人]
  weak:
    - 
    - 
    - 
