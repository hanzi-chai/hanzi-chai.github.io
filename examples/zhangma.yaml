encoder:
  max_length: 4
  auto_select_length: 4
  short_code:
    - length_equal: 1
      schemes: [{prefix: 1}, {prefix: 2}, {prefix: 3}]
  rules:
    - length_equal: 2
      formula: AaAbBaBb
    - length_equal: 3
      formula: AaBaCaCb
    - length_in_range: [4, 10]
      formula: AaBaCaZa
  sources:
    s0:
      object: null
      next: s1
    s1:
      object: {type: 字根, rootIndex: 1}
      next: c0
    s2:
      object: {type: 字根, rootIndex: 2}
      next: c1
    s3:
      object: {type: 字根, rootIndex: 3}
      next: c5
    s4:
      object: {type: 字根, rootIndex: -1}
      next: null
    s5:
      object: {type: 固定, key: t}
      next: s7
    s6:
      object: {type: 特殊, subtype: 补码}
      next: c6
    s7:
      object: {type: 固定, key: 'y'}
      next: null
    s8:
      object: {type: 特殊, subtype: 补码}
      next: s10
    s9:
      object: {type: 特殊, subtype: 补码}
      next: s11
    s10:
      object: {type: 固定, key: t}
      next: null
    s11:
      object: {type: 固定, key: 'n'}
      next: c4
    s12:
      object: {type: 固定, key: p}
      next: null
    s13:
      object: {type: 特殊, subtype: 补码}
      next: null
    s14:
      object: {type: 固定, key: 'n'}
      next: null
  conditions:
    c0:
      object: {type: 字根, rootIndex: 2}
      operator: 存在
      positive: s2
      negative: c2
    c1:
      object: {type: 字根, rootIndex: 3}
      operator: 存在
      positive: s3
      negative: c8
    c2:
      object: {type: 汉字}
      operator: 匹配
      value: '[一二三四五六七八九]'
      positive: s5
      negative: c3
    c3:
      object: {type: 汉字}
      operator: 匹配
      positive: s8
      negative: s9
      value: '[言士舟马石鸟由光女乐西子力米古白水方民耳口日身立且工]'
    c4:
      object: {type: 汉字}
      operator: 匹配
      positive: s12
      negative: null
      value: '[丌丨丬丶丿亠亻冂冖冫凵刂勹匚卩厶囗夂宀屮巛廴廾彐彡忄扌攴攵氵灬疋疒礻糸纟艹衤讠辶钅饣虍彳]'
    c5:
      object: {type: 字根, rootIndex: 4}
      operator: 存在
      positive: s4
      negative: c9
    c6:
      object: {type: 特殊, subtype: 准码元}
      operator: 是
      positive: s14
      negative: c7
      value: 'true'
    # 准码元补 n，以及仕/仁、旰/旱、汨/汩、闫/闰的消重码。
    c7:
      object: {type: 汉字}
      operator: 匹配
      value: '[仕冉半孝旰毛汨闫]'
      positive: s14
      negative: null
    # 参考表的短全码不追加补码。
    c8:
      object: {type: 汉字}
      operator: 匹配
      value: 术
      positive: null
      negative: s6
    c9:
      object: {type: 汉字}
      operator: 匹配
      value: '[晕苎]'
      positive: null
      negative: s13
