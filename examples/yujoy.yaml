  author: 朱宇浩, 钱多多
  version: 3.11.0-beta
  description: |
    十万汉字字形输入・繁简通打。
    卿云是宇浩输入法的乱序单编衍生方案。
    方案名取自《尚书大传》之「卿雲爛兮糺縵縵兮」。
