      next: null
      index: 0
    s7:
      object: {type: 字根, rootIndex: 3}
      next: null
      index: 1
    s8:
      object: {type: 固定, key: i}
      next: null
    s9: {object: {type: 字根, rootIndex: 1}, next: s10}
    s10: {object: {type: 固定, key: i}, next: s11}
    s11: {object: {type: 固定, key: i}, next: s12}
    s12: {object: {type: 固定, key: i}, next: null}
  conditions:
    c0:
      object: {type: 字根, rootIndex: 2}
      operator: 存在
      positive: s2
      negative: c4
    c1:
      object: {type: 字根, rootIndex: 3}
      operator: 存在
      positive: c2
      negative: s4
    c2:
      object: {type: 字根, rootIndex: 1}
      operator: 编码匹配
      positive: s3
      negative: s5
      value: ^[a-z]{2}$
    c3:
      object: {type: 字根, rootIndex: 4}
      operator: 存在
      positive: s6
      negative: s7
    c4:
      object: {type: 字根, rootIndex: 1}
      operator: 编码匹配
      positive: c5
      negative: null
      value: ^[a-z]$
    c5:
      object: {type: 字根, rootIndex: 1}
      operator: 匹配
      positive: null
      negative: s8
      value: '[月土八了1]'
    # 发布表的偏旁补足四码，常用成字字根沿用原补码规则。
    c6: {object: {type: 汉字}, operator: 匹配, value: '^[丨丬丶丿亠亻兀冂冈冉冖冫凵刂勹勺匚卩厂厶囗士壬夂孑宀尢屮巛廴廾彐彡彳忄戊戋扌攵曰殳氵灬犭疋疒皿礻糸纟缶耒聿肩臼艮艹虍衤讠豕豸辶酉钅阝隹饣髟]$', positive: s9, negative: s1}
