version: '0.4'
source: xkjd
info:
  name: 星空键道
  author: 吅吅大山
  version: '6.0'
  description: 单字三码起顶、词组四码起顶的双拼词顶功方案
analysis:
  classifier: {}
  degenerator:
    feature: {提: 横, 捺: 点}
    no_cross: true
  selector:
    - 全符笔顺
    - 取大优先
  customize:
    千: ['3', '1', '2']
    干: ['1', '1', '2']
