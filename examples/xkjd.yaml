    卂: ['5', '1', '2']
    平: ['1', '4', '3', '1', '2']
    缶: ['3', '1', '1', '2', '5', '2']
    臿: ['3', '1', '2', '3', '2', '1', '5', '1', '1']
    字形-00366: ['2', '3', '4', '4']
  compound_analyzer: 星空键道
