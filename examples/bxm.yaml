  max_length: 4
  auto_select_length: 4
  rules:
    - length_equal: 2
      formula: AaAbBaBb
    - length_equal: 3
      formula: AaBaCaCb
    - length_in_range: [4, 10]
      formula: AaBaCaZa
  sources:
    s0:
      object: null
      next: s1
    s1:
      object: {type: 字根, rootIndex: 1}
      next: c0
    s2:
      object: {type: 字根, rootIndex: 2}
      next: c1
    s3:
      object: {type: 字根, rootIndex: 3}
      next: c2
    s4:
      object: {type: 笔画, rootIndex: 2, strokeIndex: 1}
      next: s5
    s5:
      object: {type: 字音, subtype: 首字母}
      next: null
    s6:
      object: {type: 字根, rootIndex: -1}
      next: null
    s7:
      object: {type: 字音, subtype: 首字母}
      next: null
    s8:
      object: {type: 笔画, rootIndex: 1, strokeIndex: 1}
      next: c3
    s14:
      object: {type: 笔画, rootIndex: 1, strokeIndex: 2}
      next: s17
    s15:
      object: {type: 字根, rootIndex: 1}
      next: s16
    s16:
      object: {type: 字音, subtype: 首字母}
      next: null
    s17:
      object: {type: 字音, subtype: 首字母}
      next: null
  conditions:
    c0:
      object: {type: 字根, rootIndex: 2}
      operator: 存在
      positive: s2
      negative: s8
    c1:
      object: {type: 字根, rootIndex: 3}
      operator: 存在
      positive: s3
      negative: s4
    c2:
      object: {type: 字根, rootIndex: 4}
      operator: 存在
      positive: s6
      negative: s7
    c3:
      object: {type: 笔画, rootIndex: 1, strokeIndex: 2}
      operator: 存在
      positive: s14
      negative: s15
