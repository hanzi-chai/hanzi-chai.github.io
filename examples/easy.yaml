encoder:
  max_length: 3
  select_keys:
    - ;
    - _
  auto_select_length: 2
  sources:
    s0:
      object: null
      next: s1
    s1:
      object: {type: 字根, rootIndex: 1}
      index: 0
      next: c0
    s2:
      object: {type: 字根, rootIndex: 2}
      index: 0
      next: c1
    s3:
      object: {type: 二笔, rootIndex: 1, strokeIndex: 1}
      index: 0
      next: s6
    s4:
      object: {type: 二笔, rootIndex: 2, strokeIndex: 1}
      index: 0
      next: null
    s5:
      object: {type: 字根, rootIndex: -1}
      index: 0
      next: null
    s6:
      object: {type: 笔画, rootIndex: 1, strokeIndex: -1}
      index: 1
      next: null
  conditions:
    c0:
      object: {type: 字根, rootIndex: 2}
      operator: 存在
      positive: s2
      negative: s3
    c1:
      object: {type: 字根, rootIndex: 3}
      operator: 存在
      positive: s5
      negative: s4
  short_code:
    - length_equal: 1
      schemes: [{prefix: 2}]
  rules:
    - length_equal: 2
      formula: AaAbBa
    - length_equal: 3
      formula: AaBaCa
    - length_in_range: [4, 20]
      formula: AaBaZa
optimization:
  objective:
    characters_short:
      tiers: [{top: 3000, duplication: 4, levels: []}]
      duplication: 200
      key_distribution: 2
      pair_equivalence: 0.01
      levels: [{length: 2, frequency: -2}]
  metaheuristic:
    algorithm: SimulatedAnnealing
    parameters:
      t_max: 1
      t_min: 0.00001
      steps: 100000000
    report_after: 0.75
    search_method:
      random_move: 0.9
      random_swap: 0.09
      random_full_key_swap: 0.01
