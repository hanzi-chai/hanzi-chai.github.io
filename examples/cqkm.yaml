version: '0.4'
source: cqkm
info:
  name: 超强快码
  author: 付东升
  version: 9.3.0
  description: 26 键汉字音形码输入法
analysis:
  classifier: {}
  degenerator:
    feature:
      提: 横
      捺: 点
    no_cross: false
  selector:
    - 结构完整
    - 根少优先
    - 能连不交
    - 能散不连
    - 全符笔顺
    - 取大优先
  component_analyzer: 二笔
  compound_analyzer: 二笔
  customize:
    # 下列是抽象取根序列，不改变实际字形，也不删去字形笔画。
    字形-00721: [亻, '41', '1'] # 隹
    字形-00312: ['11', '35'] # 元
    字形-00317: ['11', '54'] # 云
    字形-00409: ['11', 小] # 示
    字形-00569: ['35', '51', '2'] # 争
    字形-00550: ['31', '54'] # 丢
    字形-08414: ['41', 口, '52'] # 亨
    字形-27405: ['41', 口, '52'] # 享
    字形-2a41f: ['41', 口, 小] # 京
    字形-0872c: ['41', 口, 口] # 高
    字形-08421: ['41', '12'] # 辛
    字形-8a204: [人, '45', '4'] # 食
    字形-04231: [人, '45'] # 今
    字形-04349: [人, '45', '4'] # 令
    字形-00285: [人, '2'] # 个
    字形-0056f: ['41', 人] # 亥
    字形-0064b: ['35', 小] # 系
    字形-003d9: ['43', 人] # 火
    字形-003e0: ['44', '44'] # 灬
    字形-08e11: ['41', 口, '11'] # 襄仅调整方案，保留数据库表示。
    # 第二轮校对：保留字形数据库，仅调整方案取根。
    字形-68a51: ["41","25","人"] # 瘸
    字形-70f05: ["12","25","25"] # 蠹
    字形-a3f1d: ["11","52"] # 酆
    字形-003dd: ["44","12"] # 斗
    字形-0139a: ["51","口"] # 司
