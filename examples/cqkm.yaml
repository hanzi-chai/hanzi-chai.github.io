encoder:
  max_length: 4
  auto_select_length: 2
  rules:
    - length_equal: 2
      formula: AaAbBaBb
    - length_equal: 3
      formula: AaBaCaCb
    - length_in_range: [4, 10]
      formula: AaBaCaZa
  sources:
    s0:
      object: null
      next: s1
    s1:
      object: {type: 字音, subtype: 首字母}
      next: s2
    s2:
      object: {type: 字根, rootIndex: 1}
      next: c0
    s3:
      object: {type: 字根, rootIndex: 2}
      next: c1
    s4:
      object: {type: 字根, rootIndex: 1}
      next: s5
    s5:
      object: {type: 字根, rootIndex: 1}
      next: null
    s6:
      object: {type: 字根, rootIndex: 3}
      next: null
    s7:
      object: {type: 字根, rootIndex: 2}
      next: null
  conditions:
    c0:
      object: {type: 字根, rootIndex: 2}
      operator: 存在
      positive: s3
      negative: s4
    c1:
      object: {type: 字根, rootIndex: 3}
      operator: 存在
      positive: s6
      negative: s7
data:
  character_set: minimal
