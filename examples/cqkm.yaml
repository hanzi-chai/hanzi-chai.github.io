    首字母-o: o
    首字母-e: e
    首字母-ê:
      element: 首字母-e
    首字母-y: 'y'
    首字母-w: w
    金: j
    钅:
      element: 金
    木: f
    朩:
      element: 木
    水: s
    氵:
      element: 水
    土: l
    士:
      element: 土
    日: 'n'
    月: c
    "\ue0d2":
      element: 月
    人: h
    亻:
      element: 人
    口: g
    手: u
    扌:
      element: 手
    艹: a
    彳: i
    小: k
    "\ue03e":
      element: 小
    辶: v
    "\ue43d":
      element: 人
    "\ue442":
      element: 小
    "\ue051":
      element: 小
    氺:
      element: 水
    曰:
      element: 日
    字形-0014b: # 贝字底
      element: 人
    字形-00284: # 合上，保留人形内部短横
      element: 人
encoder:
  max_length: 4
  auto_select_length: 2
  rules:
    - length_equal: 2
      formula: AaAbBaBb
    - length_equal: 3
      formula: AaBaCaCb
    - length_in_range: [4, 10]
      formula: AaBaCaZa
  sources:
    s0:
      object: null
      next: s1
    s1:
      object: {type: 字音, subtype: 首字母}
      next: s2
    s2:
      object: {type: 字根, rootIndex: 1}
      next: c0
    s3:
      object: {type: 字根, rootIndex: 2}
      next: c1
    s4:
      object: {type: 字根, rootIndex: 1}
      next: s5
    s5:
      object: {type: 字根, rootIndex: 1}
      next: null
    s6:
      object: {type: 字根, rootIndex: 3}
      next: null
    s7:
      object: {type: 字根, rootIndex: 2}
      next: null
  conditions:
    c0:
      object: {type: 字根, rootIndex: 2}
      operator: 存在
      positive: s3
      negative: s4
    c1:
      object: {type: 字根, rootIndex: 3}
      operator: 存在
      positive: s6
      negative: s7
data:
  # 帚的共享字形统一三层；快码仍将彐、冖作为原有首部取二笔。
  glyph_algebra:
    - from: {operator: ⿳, references: [0x002bb, 0x00175, 0x00262]}
      to: {operator: ⿱, references: [0x3a110, 0x00262]}
  # 按方案取码融合；数据库保留符合根 AGENTS.md 数据规范的图形分部。
