    首字母-s: s
    首字母-r: r
    首字母-a: a
    首字母-o: o
    首字母-e: e
    首字母-ê:
      element: 首字母-e
    首字母-y: 'y'
    首字母-w: w
    金: j
    钅:
      element: 金
    木: f
    朩:
