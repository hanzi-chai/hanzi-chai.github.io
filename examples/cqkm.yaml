    字形-2044c: ["土","34","土"] # 坴
    字形-12a26: ["35","41","11"] # 詹
    字形-28a1f: ["44","13","53"] # 寡
    字形-3284a: ["45","日","13"] # 幂
    字形-28878: ["44","45","25"] # 甯
    字形-03321: ["43","11","1"] # 兰
    字形-6653f: ["43","口","口"] # 兽
