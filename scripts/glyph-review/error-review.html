<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>字形盲选 · 错误复盘</title>
<style>
:root{color-scheme:light;--ink:#192a37;--muted:#60707a;--paper:#f4f5f2;--line:#dce3de;--accent:#176b60;--red:#b44538;--orange:#926323;--blue:#3a6692}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:150px}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 12px;color:var(--ink)}button:hover{border-color:var(--accent);color:var(--accent)}a{color:var(--accent)}header{background:#173e38;color:#f1f6f2;padding:32px max(24px,calc((100vw - 1440px)/2)) 25px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#afc6bd}h1{font-size:29px;line-height:1.4;margin:7px 0}header p{margin:7px 0;color:#cdded6;max-width:1000px}.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.stat{border:1px solid #52736a;border-radius:10px;padding:10px 17px;min-width:135px}.stat strong{font-size:26px;display:block;line-height:1.3}.stat span{font-size:13px;color:#ccdbd4}.toolbar{position:sticky;top:0;z-index:5;background:#fbfcfaef;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px max(24px,calc((100vw - 1440px)/2));display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);padding:7px 10px;border-radius:7px;background:white;min-width:130px}.toolbar input{width:230px}#filter-count{font-size:13px;color:var(--muted);margin-left:auto}.layout{max-width:1440px;margin:24px auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:25px;padding:0 24px}aside{position:sticky;top:122px;align-self:start;max-height:calc(100vh - 150px);overflow:auto}.nav-title{font-size:12px;font-weight:600;color:var(--muted);padding:0 6px 8px}#index{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}#index a{display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;background:white;border:1px solid var(--line);border-radius:7px;padding:6px}#index .han{font-size:23px}#index small{color:var(--muted);font-size:11px}.legend{font-size:12px;color:var(--muted);padding:15px 5px}.legend p{margin:8px 0}.group{background:white;border:1px solid var(--line);border-radius:13px;margin-bottom:24px;overflow:hidden;scroll-margin-top:130px}.group-head{padding:19px 23px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.character{font:40px/1.1 "Songti SC","Noto Serif CJK SC",serif}.group-head h2{font-size:18px;margin:0}.group-head small{color:var(--muted)}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}.badge{font-size:12px;padding:3px 9px;border-radius:20px;background:#edf2ef;color:var(--muted)}.badge.missing{color:var(--orange);background:#fbf0dc}.badge.rejected{color:var(--red);background:#fbece8}.badge.wrong{color:var(--blue);background:#eaf0f8}.group-body{display:grid;grid-template-columns:minmax(300px,.95fr) minmax(360px,1.05fr);gap:22px;padding:20px 23px}.panel-block{align-self:start;position:sticky;top:128px}.panel-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:5px}.panel-image{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:7px;cursor:zoom-in;background:white}.task{border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:13px}.task-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.task-title strong{font-size:16px}.meta{font-size:12px;color:var(--muted);margin:5px 0}.explanation{font-size:13px;margin:9px 0;padding-left:10px;border-left:3px solid #d4dfda}.reason-label{font-size:12px;color:var(--muted);margin-top:12px}blockquote{margin:4px 0 13px;font-size:14px;background:#f5f7f4;border-radius:6px;padding:9px 11px}.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.mini{min-width:0;border:1px solid var(--line);border-radius:7px;text-align:center;overflow:hidden}.mini-label{font-size:11px;background:#f5f7f5;padding:4px}.mini img{display:block;width:100%;height:100px;object-fit:contain;cursor:zoom-in;background:white}.mini .empty{height:100px;display:grid;place-items:center;color:var(--muted);font-size:12px;padding:8px}.mini.correct{border-color:#90b9a8}.mini.selected{border-color:#d3a398}.note{padding:0 23px 20px}.note label{display:block;font-size:13px;font-weight:600}.note textarea{width:100%;resize:vertical;min-height:75px;background:#fbfcfa;border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-top:6px}.note small{color:var(--muted);font-size:12px}.tag-options{display:flex;gap:12px;flex-wrap:wrap;margin:7px 0;font-size:12px}.tag-options label{font-weight:400;display:flex;gap:4px;align-items:center}.empty-state{padding:60px;text-align:center;color:var(--muted)}footer{max-width:1392px;margin:15px auto 35px;font-size:12px;color:var(--muted);padding:0 24px}dialog{width:95vw;max-width:1700px;height:92vh;border:1px solid var(--line);border-radius:12px;padding:0}dialog::backdrop{background:#142e34b8}.dialog-bar{position:sticky;top:0;background:white;padding:10px 15px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);z-index:1}.dialog-bar strong{margin-right:auto}.zoom-scroll{height:calc(100% - 58px);overflow:auto;background:#edf0ec;padding:16px;text-align:center}#zoom-image{display:block;height:auto;max-width:none;background:white;margin:0 auto}#status{font-size:12px;color:var(--accent)}@media(max-width:1150px){.layout{grid-template-columns:155px minmax(0,1fr);gap:15px}#index{grid-template-columns:repeat(2,1fr)}}@media(max-width:980px){.group-body{grid-template-columns:1fr}.panel-block{position:static}.panel-image{max-height:670px;object-fit:contain}}@media(max-width:720px){header{padding:24px 17px}.toolbar{padding:10px 15px}.toolbar input{width:100%}.layout{display:block;padding:0 12px}aside{position:static;max-height:180px;margin-bottom:15px}#index{grid-template-columns:repeat(7,1fr)}.legend{display:none}.group-body{padding:15px;gap:15px}.group-head{padding:15px}.note{padding:0 15px 15px}.mini img,.mini .empty{height:90px}#filter-count{margin-left:0}h1{font-size:24px}}@media print{.toolbar,aside,.note,button,footer{display:none}.layout{display:block;padding:0}.group{break-inside:avoid}.panel-block{position:static}header{color:black;background:white}.stats .stat{color:black}dialog{display:none}}
</style>
</head>
<body>
<header><div class="eyebrow">HANZI CHAI / ERROR REVIEW</div><h1>字形盲选 · 按字复盘</h1><p id="subtitle"></p><div class="stats" id="stats"></div></header>
<div class="toolbar"><input id="search" aria-label="搜索字符、码位或理由" placeholder="搜索字符、码位或理由"><select id="kind" aria-label="错误类型"><option value="all">全部错误类型</option><option value="missing">候选缺失</option><option value="rejected">有候选但误拒</option><option value="wrong">有候选但选错</option></select><select id="source" aria-label="来源"><option value="all">全部来源</option></select><select id="sort" aria-label="排序"><option value="count">错误多的字优先</option><option value="codepoint">按码位排序</option></select><button id="export">导出人工分析</button><button id="import">导入分析</button><input id="import-file" type="file" accept="application/json" hidden><span id="filter-count"></span><span id="status" role="status"></span></div>
<div class="layout"><aside><div class="nav-title">字符索引 · 数字为错误项数</div><nav id="index"></nav><div class="legend"><p>按字符展示当次实际 panel；若错误来自不同递进轮次，则分别保留对应图。图中可能包含正确来源，方便对照。</p><p>候选字母以各来源行标记为准。点击图片可放大。</p><p>错误类型来自冻结评分；agent 原始理由不是已确认的视觉根因。</p></div></aside><main id="groups"></main></div>
<footer id="footer"></footer>
<dialog id="zoom"><div class="dialog-bar"><strong id="zoom-title"></strong><button id="fit">适合窗口</button><button id="actual">原始尺寸</button><button id="larger">放大 1.5 倍</button><button id="close">关闭</button></div><div class="zoom-scroll"><img id="zoom-image" alt="放大的字形对照"></div></dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('review-data').textContent), $=id=>document.getElementById(id);
const labels={missing:'候选缺失',rejected:'有候选但误拒',wrong:'有候选但选错'};
const node=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
let notes={};try{notes=JSON.parse(localStorage.getItem(data.storageKey)||'{}');}catch{}
function persist(){try{localStorage.setItem(data.storageKey,JSON.stringify(notes));$('status').textContent='已保存到本机浏览器';}catch{$('status').textContent='浏览器未开放本地存储，请导出分析保存';}}
$('subtitle').textContent=`${data.batch} · ${data.correct}/${data.total}（${(100*data.correct/data.total).toFixed(2)}%）的冻结结果。按历史人工标注及原评分口径列出错误；原图、panel 与提交均保持不变。`;
for(const [number,title] of [[data.characterCount,'有错误的字符'],[data.errorCount,'错误来源任务'],[data.counts.missing,'候选缺失'],[data.counts.rejected,'有候选但误拒'],[data.counts.wrong,'有候选但选错']]){const card=node('div','stat');card.append(node('strong','',number),node('span','',title));$('stats').append(card);}
for(const source of data.sources){const o=node('option','',source);o.value=source;$('source').append(o);}
$('footer').textContent=`生成于 ${new Date(data.generatedAt).toLocaleString('zh-CN')}。本文件自包含全部图片，可离线打开。人工备注仅保存到浏览器或导出的 JSON，不会修改原判定、数据库或训练集。`;
let zoomWidth=0;function zoomImage(id,title){const img=$('zoom-image');img.src=data.assets[id];$('zoom-title').textContent=title;img.onload=()=>{zoomWidth=Math.min(img.naturalWidth,$('zoom').clientWidth-34);img.style.width=zoomWidth+'px';};$('zoom').showModal();}
$('close').onclick=()=>$('zoom').close();$('fit').onclick=()=>{zoomWidth=Math.min($('zoom-image').naturalWidth,$('zoom').clientWidth-34);$('zoom-image').style.width=zoomWidth+'px';};$('actual').onclick=()=>{zoomWidth=$('zoom-image').naturalWidth;$('zoom-image').style.width=zoomWidth+'px';};$('larger').onclick=()=>{zoomWidth*=1.5;$('zoom-image').style.width=zoomWidth+'px';};
function image(id,title,cls){const img=node('img',cls);img.src=data.assets[id];img.alt=title;img.loading='lazy';img.onclick=()=>zoomImage(id,title);return img;}
function mini(title,id,cls,empty){const box=node('div','mini '+(cls||''));box.append(node('div','mini-label',title));box.append(id?image(id,title):node('div','empty',empty));return box;}
function render(){const query=$('search').value.trim().toLowerCase(),kind=$('kind').value,source=$('source').value;let groups=data.groups.map(g=>({...g,items:g.items.filter(t=>(kind==='all'||t.kind===kind)&&(source==='all'||t.source===source)&&(!query||[g.character,g.id,'u+'+g.id,t.id,t.reason,t.explanation].some(v=>v.toLowerCase().includes(query))))})).filter(g=>g.items.length);if($('sort').value==='codepoint')groups.sort((a,b)=>a.unicode-b.unicode);else groups.sort((a,b)=>b.items.length-a.items.length||a.unicode-b.unicode);$('groups').replaceChildren();$('index').replaceChildren();$('filter-count').textContent=`显示 ${groups.length} 字 / ${groups.reduce((n,g)=>n+g.items.length,0)} 项（全部 ${data.characterCount} 字 / ${data.errorCount} 项）`;
for(const g of groups){const link=node('a');link.href='#char-'+g.id;link.append(node('span','han',g.character),node('small','',g.items.length));$('index').append(link);const card=node('section','group');card.id='char-'+g.id;const head=node('div','group-head'),titles=node('div');titles.append(node('h2','',`${g.character} · U+${g.id}`),node('small','',`本字 ${g.totalSources} 个来源任务，当前显示 ${g.items.length} 项错误`));head.append(node('span','character',g.character),titles);const badges=node('div','badges');for(const k of Object.keys(labels)){const n=g.items.filter(t=>t.kind===k).length;if(n)badges.append(node('span','badge '+k,`${labels[k]} ${n}`));}head.append(badges);card.append(head);const body=node('div','group-body'),panel=node('div','panel-block'),panelLabel=node('div','panel-label');panelLabel.append(node('span','',`原始完整 panel · ${g.character}`));const open=node('button','', '放大查看');open.onclick=()=>zoomImage(g.panel,`${g.character} U+${g.id} 原始 panel`);panelLabel.append(open);panel.append(panelLabel);for(const v of(g.panelVariants||[{image:g.panel,label:`${g.character} 原始 panel`}])){if(g.panelVariants&&g.panelVariants.length>1)panel.append(node('div','meta',v.label));panel.append(image(v.image,v.label,'panel-image'));}body.append(panel);const details=node('div');for(const t of g.items){const task=node('article','task');task.dataset.taskId=t.id;const title=node('div','task-title');title.append(node('strong','',`${t.source} 源`),node('span','badge '+t.kind,t.label));task.append(title,node('div','meta',`${t.id} · agent：${t.choice===null?'全部不匹配':t.choice} · 历史正确候选：${t.correctKeys.length?t.correctKeys.join('、'):'未覆盖'}`),node('p','explanation',t.explanation),node('div','reason-label','agent 原始判断理由（原文）'),node('blockquote','',t.reason));const comparison=node('div','mini-grid');comparison.append(mini('Unicode 目标来源',t.target),mini(`agent ${t.choice===null?'拒绝':'所选 '+t.choice}`,t.selected,'selected','没有选择候选'));const right=node('div','mini correct');right.append(node('div','mini-label',t.correct.length?`历史正确 ${t.correctKeys.join('、')}`:'历史正确候选'));if(t.correct.length)for(const c of t.correct)right.append(image(c.image,`${t.id} 历史正确候选 ${c.key}`));else right.append(node('div','empty','此来源候选未覆盖'));comparison.append(right);task.append(comparison,node('div','meta',`${t.reviewer} · 统计基线${t.statisticalCorrect?'正确':'错误'} · 视觉根因待人工分析`));details.append(task);}body.append(details);card.append(body);const note=node('div','note'),label=node('label','', '人工分析 · 同字统一记录'),textarea=node('textarea');textarea.setAttribute('aria-label',`${g.character} 的人工分析`);textarea.placeholder='记录真正的区分笔画、渲染问题、标签疑问或下一步调整……';textarea.value=notes[g.id]?.text||'';textarea.oninput=()=>{notes[g.id]={...notes[g.id],text:textarea.value,updatedAt:new Date().toISOString()};persist();};const tags=node('div','tag-options');for(const tag of ['候选生成','视觉误判','布局渲染','历史标注 / 等价口径','待仲裁']){const label=node('label'),check=node('input');check.type='checkbox';check.checked=(notes[g.id]?.tags||[]).includes(tag);check.onchange=()=>{const values=new Set(notes[g.id]?.tags||[]);check.checked?values.add(tag):values.delete(tag);notes[g.id]={...notes[g.id],tags:[...values],updatedAt:new Date().toISOString()};persist();};label.append(check,tag);tags.append(label);}note.append(label,textarea,tags,node('small','', '仅保存人工分析，不改写 agent 原始提交。'));card.append(note);$('groups').append(card);}if(!groups.length)$('groups').append(node('div','empty-state','没有符合筛选条件的错误。'));}
for(const id of ['search','kind','source','sort'])$(id).addEventListener(id==='search'?'input':'change',render);
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({batch:data.batch,reportKey:data.storageKey,exportedAt:new Date().toISOString(),notes},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download=data.batch+'-human-analysis.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('import').onclick=()=>$('import-file').click();$('import-file').onchange=async event=>{try{const f=event.target.files[0];if(!f)return;const imported=JSON.parse(await f.text());if(imported.reportKey!==data.storageKey||!imported.notes||typeof imported.notes!=='object')throw Error('不是此冻结批次的人工分析');for(const [cp,n] of Object.entries(imported.notes)){if(!data.groups.some(g=>g.id===cp)||!n||typeof n!=='object'||(n.text!==undefined&&typeof n.text!=='string')||(n.tags!==undefined&&(!Array.isArray(n.tags)||n.tags.some(t=>typeof t!=='string'))))throw Error('备注数据格式不正确');}notes={...notes,...imported.notes};persist();render();}catch(error){$('status').textContent='导入失败：'+error.message;}finally{event.target.value='';}};
render();
</script>
</body>
</html>
